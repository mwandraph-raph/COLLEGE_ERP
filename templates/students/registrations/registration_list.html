{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h2>Unit Registrations</h2>

        <a
            href="{% url 'registration_create' %}"
            class="btn btn-primary">
            New Registration
        </a>
    </div>


    <!-- FILTERS -->
    <form
        method="get"
        class="row mb-3"
        id="registrationFilterForm">

        <!-- ADMISSION NUMBER -->
        <div class="col-md-4">
            <input
                type="text"
                name="search"
                id="registrationSearch"
                class="form-control"
                placeholder="Admission Number">
        </div>


        <!-- ACADEMIC YEAR -->
        <div class="col-md-3">
            <select
                name="academic_year"
                id="academicYearFilter"
                class="form-select">

                <option value="">
                    Select Academic Year
                </option>

            </select>
        </div>


        <!-- SEMESTER -->
        <div class="col-md-3">
            <select
                name="semester"
                id="semesterFilter"
                class="form-select">

                <option value="">
                    Select Semester
                </option>

            </select>
        </div>


        <!-- FILTER BUTTON -->
        <div class="col-md-2">
            <button
                type="submit"
                class="btn btn-success w-100">
                Filter
            </button>
        </div>

    </form>


    <!-- REGISTRATION TABLE -->
    <div class="table-responsive">

        <table class="table table-hover">

            <thead>
                <tr>
                    <th>Student</th>
                    <th>Academic Year</th>
                    <th>Semester</th>
                    <th>Registration Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentRegistrationTable">
            </tbody>

        </table>

    </div>


    <!-- ALL REGISTRATION RECORDS -->
    <div
        id="registrationData"
        style="display: none;">

        {% for registration in registrations %}

        <div
            class="registration-record"

            data-student-id="{{ registration.enrollment.student.id }}"

            data-student-name="{{ registration.enrollment.student }}"

            data-admission-no="{{ registration.enrollment.student.admission_no }}"

            data-academic-year="{{ registration.enrollment.academic_year }}"

            data-semester="{{ registration.enrollment.semester }}"

            data-unit="{{ registration.registered_unit }}"

            data-registered-at="{{ registration.registered_at|date:'d M Y, H\:i' }}"

            data-timestamp="{{ registration.registered_at|date:'U' }}"

            data-edit-url="{% url 'registration_update' registration.id %}"

            data-delete-url="{% url 'registration_delete' registration.id %}">
        </div>

        {% endfor %}

    </div>


    <!-- NO REGISTRATIONS -->
    <div
        id="noRegistrationsMessage"
        class="alert alert-info"
        style="display: none;">

        No registrations found.

    </div>

</div>

{% endblock %}
