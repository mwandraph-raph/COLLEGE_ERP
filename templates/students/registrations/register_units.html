{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="card">

<div class="card-header">

<h4>Register Units</h4>

<p class="mb-0">

<strong>{{ enrollment.student }}</strong><br>

{{ enrollment.programme_level }}

</p>

</div>

<div class="card-body">

<form method="post">

{% csrf_token %}

<table class="table table-striped">

<thead>

<tr>

<th></th>

<th>Code</th>

<th>Unit</th>

<th>Credit Hours</th>

</tr>

</thead>

<tbody>

{% for unit in units %}

<tr>

<td>

<input
type="checkbox"
name="units"
value="{{ unit.id }}">

</td>

<td>{{ unit.code }}</td>

<td>{{ unit.name }}</td>

<td>{{ unit.credit_hours }}</td>

</tr>

{% endfor %}

</tbody>

</table>

<button
class="btn btn-success">

Register Selected Units

</button>

<a href="{% url 'semester_enrollment_detail' enrollment.id %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
