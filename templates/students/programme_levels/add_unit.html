{% extends "base.html" %}


{% block content %}


<div class="container mt-4">


<h3>
Add Unit
</h3>


<h5 class="text-muted">

{{ programme_level.programme.name }}

-

{{ programme_level.academic_level }}

</h5>



<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label>
Unit Code
</label>

<input 
type="text"
name="code"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Unit Name
</label>

<input 
type="text"
name="name"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Credit Hours
</label>

<input 
type="number"
name="credit_hours"
class="form-control"
required>

</div>



<button class="btn btn-success">

Save Unit

</button>


<a href="{% url 'programme_level_units' programme_level.id %}"
class="btn btn-secondary">

Cancel

</a>


</form>


</div>


{% endblock %}
