{% extends "base.html" %}


{% block content %}


<div class="container mt-4">


<div class="card shadow">


<div class="card-body">


<h4>
Delete Unit Offering
</h4>


<p>

Are you sure you want to remove:

<strong>
{{ offering.unit }}
</strong>

from:

<strong>
{{ offering.semester }}
</strong>

?

</p>


<form method="post">

{% csrf_token %}


<button type="submit"
        class="btn btn-danger">

Confirm Delete

</button>


<a href="{% url 'unit_offering_list' %}"
   class="btn btn-secondary">

Cancel

</a>


</form>


</div>


</div>


</div>


{% endblock %}
