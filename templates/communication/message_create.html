{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

<div class="mb-4">

    <a href="{% url 'communication_messages' %}" class="text-decoration-none">
        <i class="fa-solid fa-arrow-left me-1"></i>
        Back to Messages
    </a>

    <h2 class="mt-3 mb-1">New Message</h2>

    <p class="text-muted mb-0">
        Send a private institutional message to a student.
    </p>

</div>

<div class="card shadow-sm">

    <div class="card-header">
        <strong>Compose Message</strong>
    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Recipient
                </label>

                <select
                    name="recipient"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select recipient
                    </option>

                    {% for recipient in recipients %}

                        <option
                            value="{{ recipient.pk }}"
                            {% if recipient.pk|stringformat:"s" == recipient_id|stringformat:"s" %}
                                selected
                            {% endif %}
                        >
                            {{ recipient.get_full_name|default:recipient.username }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Subject
                </label>

                <input
                    type="text"
                    name="subject"
                    class="form-control"
                    value="{{ subject|default:'' }}"
                    maxlength="255"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Message
                </label>

                <textarea
                    name="body"
                    class="form-control"
                    rows="8"
                    required
                    placeholder="Write your message..."
                >{{ body|default:'' }}</textarea>

            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="fa-solid fa-paper-plane me-1"></i>
                    Send Message
                </button>

                <a
                    href="{% url 'communication_messages' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</div>

{% endblock %}
