{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#012169">

    <title>
        {% block title %}
            Xorami College ERP
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        rel="stylesheet"
    >

    <!-- ERP Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Favicon -->
    <link rel="icon" href="{% static 'images/favicon.png' %}">

    <!-- =====================================================
         XORADEX EDUCORE ERP
         GLOBAL CSS
         -----------------------------------------------------
         erp.css is the central ERP-wide CSS aggregator.
         Do NOT separately load files already imported by it.
         ===================================================== -->

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/erp.css' %}">

    <!-- Page-specific CSS -->
    {% block extra_css %}
    {% endblock %}
</head>

<body class="erp-body">

<div id="app" class="erp-wrapper">

    <!-- =====================================================
         TOPBAR
         ===================================================== -->
    <header class="erp-header">
        {% include "includes/topbar.html" %}
    </header>


    <!-- =====================================================
         ERP WORKSPACE
         ===================================================== -->
    <div class="erp-workspace">

        {% include "includes/sidebar.html" %}

        <main class="erp-content">

            {% include "includes/messages.html" %}

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>


<!-- =========================================================
     GLOBAL JAVASCRIPT
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'js/sidebar.js' %}"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="{% static 'js/dashboard.js' %}"></script>

<script src="{% static 'js/registration_list.js' %}"></script>

<script src="{% static 'js/semester_enrollments.js' %}"></script>

<script src="{% static 'js/lecturer_assignments.js' %}?v=2"></script>

<script src="{% static 'js/results_approval.js' %}?v=1"></script>

<script src="{% static 'js/programme_list.js' %}?v=1"></script>

<script src="{% static 'js/programme_levels.js' %}?v=1"></script>


{% block extra_js %}
{% endblock %}

</body>
</html>
